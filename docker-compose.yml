# 安鑫保险智能客服 · 一键启动
# 用法:
#   1) cp .env.example .env  并填写密钥
#   2) docker compose up -d --build
#   3) 打开 http://localhost  （管理端）/ http://localhost/mobile.html（手机端）
#
# 只暴露 80 端口，MySQL / Redis / 后端均不对外，符合内网私有化交付要求。
# 公网部署额外做了：Redis 密码、容器资源上限（防单容器拖垮整机）、
# 容器提权禁用（no-new-privileges / backend 丢弃全部 capability）。
name: insurance-ai

services:
  mysql:
    image: mysql:8.0
    container_name: insurance-ai-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-insurance_ai}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行 sql/ 下的初始化脚本（按文件名顺序，v2 排在主脚本之后）
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    # 资源上限：单容器失控时只影响自己，不会把 4G 小机器整机拖死
    mem_limit: 768m
    pids_limit: 2048
    security_opt:
      - no-new-privileges:true
    networks: [insurance-net]

  redis:
    image: redis:7-alpine
    container_name: insurance-ai-redis
    restart: unless-stopped
    # 即使容器网络不对外，Redis 仍加密码：多一层，防同宿主机其它容器横向访问
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:-redis-change-me}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 6
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-change-me}
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    networks: [insurance-net]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: insurance-ai-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-insurance_ai}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-change-me}
      # 以下三项必须显式提供，缺失时启动会打印告警（JWT 用默认值、API Key 无法解密）
      INSURE_JWT_SECRET: ${INSURE_JWT_SECRET:?请在 .env 中设置 INSURE_JWT_SECRET（长度 >= 32）}
      INSURE_CRYPTO_SECRET: ${INSURE_CRYPTO_SECRET:?请在 .env 中设置 INSURE_CRYPTO_SECRET（国密 SM4 主密钥，配置后不可变更）}
      # 可选：仅在数据库没有模型配置时用于初始化首条记录，之后以后台配置为准
      INSURE_DEEPSEEK_API_KEY: ${INSURE_DEEPSEEK_API_KEY:-}
      # 短信：运营商未接入时保持 mock=true（验证码随响应回显、只打日志），接入后改 false
      INSURE_SMS_MOCK: ${INSURE_SMS_MOCK:-true}
      INSURE_SMS_VERIFY_REGISTER: ${INSURE_SMS_VERIFY_REGISTER:-true}
      # 防刷阈值：同 IP 小时/日上限与全站每日短信预算
      INSURE_SMS_IP_HOURLY_LIMIT: ${INSURE_SMS_IP_HOURLY_LIMIT:-20}
      INSURE_SMS_IP_DAILY_LIMIT: ${INSURE_SMS_IP_DAILY_LIMIT:-50}
      INSURE_SMS_GLOBAL_DAILY_LIMIT: ${INSURE_SMS_GLOBAL_DAILY_LIMIT:-1000}
      # 图形验证码:生产必须 enabled=true 且 debug=false(否则验证码明文回显)
      INSURE_CAPTCHA_ENABLED: ${INSURE_CAPTCHA_ENABLED:-true}
      INSURE_CAPTCHA_DEBUG: ${INSURE_CAPTCHA_DEBUG:-false}
      # 文件上传限额:全局硬上限 + 分业务限额(与全局取小)
      INSURE_UPLOAD_MAX_SIZE: ${INSURE_UPLOAD_MAX_SIZE:-50MB}
      INSURE_UPLOAD_AVATAR_LIMIT: ${INSURE_UPLOAD_AVATAR_LIMIT:-2MB}
      INSURE_UPLOAD_KB_LIMIT: ${INSURE_UPLOAD_KB_LIMIT:-20MB}
      INSURE_UPLOAD_CHAT_IMAGE_LIMIT: ${INSURE_UPLOAD_CHAT_IMAGE_LIMIT:-10MB}
      INSURE_UPLOAD_CHAT_VIDEO_LIMIT: ${INSURE_UPLOAD_CHAT_VIDEO_LIMIT:-50MB}
      INSURE_UPLOAD_COMMON_LIMIT: ${INSURE_UPLOAD_COMMON_LIMIT:-20MB}
      # 公网部署默认关闭接口文档（Nginx 层还额外拦了一道）
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED:-false}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED:-false}
    volumes:
      # 日志与上传文件落宿主机，容器重建不丢
      - ./data/logs:/app/logs
      - ./data/upload:/app/upload
    # 4G 小机器上给后端封顶 1G（JVM 按 MaxRAMPercentage=75 取到约 768M 堆）
    mem_limit: 1024m
    pids_limit: 4096
    # 丢弃全部 Linux capability：后端只需要监听 8080（非特权端口），不需要任何特权
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks: [insurance-net]

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: insurance-ai-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    networks: [insurance-net]

volumes:
  mysql-data:
  redis-data:

networks:
  insurance-net:
    driver: bridge

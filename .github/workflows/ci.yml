name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    name: 后端编译与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 编译
        working-directory: backend
        run: mvn -B -q compile
      - name: 单元测试
        working-directory: backend
        run: mvn -B test
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 类型检查
        working-directory: frontend
        run: npx vue-tsc --noEmit
      - name: 生产构建
        working-directory: frontend
        run: npx vite build

  secret-scan:
    name: 密钥泄漏检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 扫描硬编码密钥
        run: |
          set +e
          found=$(grep -rnE "(sk-[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH) PRIVATE KEY)" \
            --include='*.java' --include='*.yml' --include='*.yaml' \
            --include='*.ts' --include='*.vue' --include='*.properties' \
            --exclude-dir=node_modules --exclude-dir=target --exclude-dir=dist . \
            | grep -vE 'sk-(fake|AbCd)')
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::发现疑似真实密钥，请改用环境变量注入"
            exit 1
          fi
          echo "未发现硬编码密钥"

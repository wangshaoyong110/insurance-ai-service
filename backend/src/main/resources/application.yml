server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: insurance-ai-service
  profiles:
    active: dev
  # ---------------- 数据源 ----------------
  # 账号密码走环境变量,未设置时回退到本地开发默认值(root/root),便于 clone 后直接跑起来
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:insurance_ai}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
  # ---------------- Redis ----------------
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  # ---------------- 文件上传 ----------------
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: always

# ---------------- MyBatis-Plus ----------------
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.insure.ai.modules
  configuration:
    map-underscore-to-camel-case: true
    # SQL 通过 SLF4J 输出,可随应用日志一起落盘并按 traceId 追踪
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------------- 业务自定义配置 ----------------
insure:
  jwt:
    # 生产环境请通过环境变量 INSURE_JWT_SECRET 覆盖,长度必须 >= 32 字节
    secret: ${INSURE_JWT_SECRET:insurance-ai-dev-only-jwt-secret-change-me-32bytes}
    # token 有效期(毫秒),默认 7 天
    expire: 604800000
    header: Authorization
    prefix: "Bearer "
  crypto:
    # API Key 加密主密钥(国密 SM4-GCM,密钥由 PBKDF2-HMAC-SM3 派生)
    # 生产必须通过环境变量 INSURE_CRYPTO_SECRET 注入;未配置时使用内置默认值并打印安全告警
    # 配置后不可变更,否则已入库的密文无法解密(历史 AES 密文会在启动时自动迁移为 SM4)
    secret: ${INSURE_CRYPTO_SECRET:}
  # ---------------- 短信验证码 ----------------
  # 运营商的真实发送动作尚未接入:SmsServiceImpl#doSend 只打日志并返回成功,
  # mock=true 时验证码会随响应回显,便于演示;上线前接入运营商后改为 false
  sms:
    mock: true
    # 注册是否强制校验短信验证码(本地联调可临时关闭)
    verify-register: true
    # 验证码有效期(秒)
    expire-seconds: 300
    # 同一手机号同一场景重发间隔(秒)
    resend-interval: 60
    # 同一手机号每日发送上限
    daily-limit: 10
    # 已开放的短信场景(登录/重置密码未实现前不要放开,否则可被用来换场景刷量)
    supported-scenes:
      - register
    # 同一 IP 一小时 / 一自然日发送上限:防止换个手机号继续轰炸
    ip-hourly-limit: 20
    ip-daily-limit: 50
    # 全站每自然日发送总量上限:保护短信预算,防止代理池分布式刷量
    global-daily-limit: 1000
    # 单条验证码允许的校验失败次数
    max-verify-attempts: 5
    # 验证码位数
    code-length: 6
    # 短信签名与模板编号(接入运营商后使用)
    sign-name: 安鑫保险
    template-code: SMS_000000
  upload:
    # 本地存储根目录(Windows 示例:D:/insurance-upload/,Linux 示例:/data/upload/)
    path: ./upload/
    # 访问前缀,与 WebMvcConfig 中资源映射保持一致
    url-prefix: /api/upload/
  security:
    # 可信反向代理 IP:只有 TCP 对端在此列表中才采信 X-Forwarded-For。
    # 默认空 = 一律不信任代理头,防止伪造 IP 绕过限流;
    # 部署在 Nginx/网关后,把网关内网 IP(如 127.0.0.1、10.0.0.8)填进来。
    trusted-proxies: []
    # 免认证白名单
    white-list:
      # 客户端(客户)免登录接口
      - /auth/login
      - /auth/register
      - /auth/sms-code
      - /auth/captcha
      # 管理端(业务操作人员)登录入口,与客户端完全独立
      - /admin/auth/login
      - /upload/**
      - /error
      # 接口文档(Swagger UI + OpenAPI JSON),内网交付时可通过 springdoc.api-docs.enabled=false 关闭
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      # 健康检查:供容器编排/负载均衡探活,只暴露 status,不含细节
      - /actuator/health
      - /actuator/health/**
  deepseek:
    base-url: https://api.deepseek.com
    # 仅用于首次启动时把配置迁移到数据表 ai_model_config(加密落库)
    # 通过环境变量 INSURE_DEEPSEEK_API_KEY 注入;留空则跳过迁移,
    # 改为登录后台「系统管理 → 模型配置」手动添加
    api-key: ${INSURE_DEEPSEEK_API_KEY:}
    model: deepseek-chat
    # 请求超时(毫秒)
    timeout: 60000
    # 携带的历史对话条数
    history-size: 10
    temperature: 0.3

# ---------------- 接口文档(Swagger / OpenAPI 3) ----------------
# 入口:http://localhost:8080/api/swagger-ui.html
springdoc:
  api-docs:
    # 生产/内网交付可置为 false 彻底关闭文档暴露
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    # 访问 /swagger-ui.html 会自动跳转到 /swagger-ui/index.html
    path: /swagger-ui.html
    # 接口按标签名与接口名排序,便于人工查阅
    tags-sorter: alpha
    operations-sorter: alpha
    # 不在页面内加载官方 demo 地址,只展示本地分组
    disable-swagger-default-url: true
    display-request-duration: true
    # 默认选中「管理端接口」分组
    urls-primary-name: 管理端接口
  # 只扫描业务模块,排除 Spring 自带的 /error 等端点
  packages-to-scan: com.insure.ai.modules
  default-produces-media-type: application/json
  cache:
    disabled: true

# ---------------- 健康检查 / 指标 ----------------
# /api/actuator/health 已加入安全白名单,供容器健康检查与负载均衡探活使用
# 细节(数据库/Redis/磁盘)只在带凭证访问时返回,避免对内网暴露拓扑信息
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        # 不开放 env/heapdump 等敏感端点
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true

# ---------------- 日志 ----------------
# 具体滚动与压缩策略见 resources/logback-spring.xml
#   - 按天滚动:logs/yyyy-MM-dd/app.2026-11-04.0.log.gz
#   - 保留 30 天,自动 gzip 压缩
#   - 日志格式包含 traceId(响应头 X-Trace-Id 同步返回,便于前后端联查)
logging:
  config: classpath:logback-spring.xml
  file:
    path: ./logs
  level:
    root: info
    com.insure.ai: debug
    org.springframework.security: warn

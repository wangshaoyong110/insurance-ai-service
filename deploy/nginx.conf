# 安鑫保险智能客服 · Nginx 站点配置
# 结构：/ 管理端 SPA（history 路由）  /mobile.html 手机端（hash 路由）  /api 后端
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;

    # 只保留必要信息，不暴露版本号
    server_tokens off;

    # 容器健康检查（不写访问日志，避免刷屏）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ---------------- 流式对话（必须单独配，且要放在 /api/ 之前） ----------------
    # Nginx 默认 proxy_buffering on，会把 SSE 攒满缓冲区才下发，
    # 结果就是"流式"退化成"等十几秒一次性返回"。这里必须关掉。
    location = /api/chat/send/stream {
        proxy_pass http://backend:8080/api/chat/send/stream;

        proxy_http_version 1.1;
        # 关闭 keepalive 复用，避免连接被复用后提前关闭
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        gzip off;

        # 模型生成长回答可能超过默认 60s
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------------- 后端接口 ----------------
    location /api/ {
        proxy_pass http://backend:8080/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # ---------------- 静态资源 ----------------
    # 构建产物带 content hash，可放心长缓存
    location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---------------- 前端入口 ----------------
    # 管理端是 history 路由：任何未命中的路径都要回落到 index.html，
    # 否则刷新 /service/policy 这类子路由会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML 不缓存，保证发版后用户拿到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /mobile.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------------- 安全响应头 ----------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------- 压缩 ----------------
    # 注意不要包含 text/event-stream，压缩会破坏流式分帧
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}

# 安鑫保险智能客服 · Nginx 站点配置（公网部署版）
# 结构：/ 管理端 SPA（history 路由）  /mobile.html 手机端（hash 路由）  /api 后端
#
# 公网暴露面收敛原则：
#   1. 只监听 80；后端 8080、MySQL 3306、Redis 6379 都不映射到宿主机
#   2. 接口文档、actuator 等运维端点对公网一律 404
#   3. 登录/短信/聊天三类高价值接口单独限流，防止撞库与刷模型费用
#   4. 全站加 CSP 等安全响应头，禁止被第三方站点内嵌

# ============ 限流与并发（http 上下文，本文件被 conf.d 在 http 内 include） ============
# 普通接口：单 IP 30 r/s，允许突发 60，超出返回 429
limit_req_zone $binary_remote_addr zone=rl_global:10m rate=30r/s;
# 登录/注册/验证码：单 IP 每分钟 12 次，撞库成本极高
limit_req_zone $binary_remote_addr zone=rl_auth:10m rate=12r/m;
# 短信下发：单 IP 每分钟 3 次（应用层还有小时/日限额，这里挡在前面）
limit_req_zone $binary_remote_addr zone=rl_sms:10m rate=3r/m;
# 聊天：单 IP 每分钟 20 次，防止刷爆模型额度
limit_req_zone $binary_remote_addr zone=rl_chat:10m rate=20r/m;
# 上传：单 IP 每分钟 20 次
limit_req_zone $binary_remote_addr zone=rl_upload:10m rate=20r/m;
# 单 IP 并发连接数，挡住慢连接耗尽 worker
limit_conn_zone $binary_remote_addr zone=conn_ip:10m;

limit_req_status 429;
limit_conn_status 429;

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;

    # 只保留必要信息，不暴露 nginx 版本号
    server_tokens off;
    # 关闭目录列表，防止误放的备份文件被遍历
    autoindex off;

    # 慢请求防护：客户端不往上传数据就断开，避免连接被长期占用
    client_body_timeout 20s;
    client_header_timeout 15s;
    send_timeout 60s;
    keepalive_timeout 30s;

    # 单 IP 并发连接上限
    limit_conn conn_ip 20;

    # 只接受业务需要的 HTTP 方法，TRACE/TRACK 等直接拒绝
    if ($request_method !~ ^(GET|POST|PUT|DELETE|HEAD|OPTIONS)$) {
        return 405;
    }

    # 统一错误响应：限流与拒绝都返回 JSON，前端能正常提示而不是白屏
    error_page 429 = @too_many;
    location @too_many {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 429 '{"code":429,"message":"请求过于频繁，请稍后再试"}';
    }
    error_page 405 = @bad_method;
    location @bad_method {
        default_type application/json;
        return 405 '{"code":405,"message":"不支持的请求方法"}';
    }

    # ---------------- 安全响应头（所有响应） ----------------
    include /etc/nginx/snippets/sec-headers.inc;

    # ---------------- 隐藏运维面 ----------------
    # 接口文档 / Swagger / actuator 不对公网开放。
    # 容器 HEALTHCHECK 走 127.0.0.1:8080 内网，不经过 Nginx，所以拦掉不影响探活。
    location ~ ^/api/(doc\.html|swagger-ui|v3/api-docs|webjars|actuator) {
        return 404;
    }

    # 备份/源码/密钥类文件绝不外泄
    location ~* \.(?:sql|log|bak|old|orig|swp|ini|conf|yml|yaml|pem|key|jar|sh|tar|gz|zip)$ {
        return 404;
    }
    # .git / .env / .svn 等隐藏目录（放行 ACME 证书校验路径）
    location ~ /\.(?!well-known) {
        return 404;
    }

    # ---------------- 容器健康检查 ----------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ---------------- 流式对话（必须单独配，且要放在 /api/ 之前） ----------------
    # Nginx 默认 proxy_buffering on，会把 SSE 攒满缓冲区才下发，
    # 结果就是"流式"退化成"等十几秒一次性返回"。这里必须关掉。
    location = /api/chat/send/stream {
        limit_req zone=rl_chat burst=3 nodelay;

        proxy_pass http://backend:8080/api/chat/send/stream;
        include /etc/nginx/snippets/proxy.inc;

        # 关闭 keepalive 复用，避免连接被复用后提前关闭
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        gzip off;

        # 模型生成长回答可能超过默认 60s
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------------- 高价值接口单独限流 ----------------
    # 登录 / 注册 / 图形验证码（含管理端）
    location ~ ^/api/(admin/)?auth/(login|register|captcha)$ {
        limit_req zone=rl_auth burst=6 nodelay;
        proxy_pass http://backend:8080$request_uri;
        include /etc/nginx/snippets/proxy.inc;
    }

    # 短信验证码下发
    location ~ ^/api/(admin/)?auth/sms/ {
        limit_req zone=rl_sms burst=3 nodelay;
        proxy_pass http://backend:8080$request_uri;
        include /etc/nginx/snippets/proxy.inc;
    }

    # 发消息（非流式）
    location = /api/chat/send {
        limit_req zone=rl_chat burst=6 nodelay;
        proxy_pass http://backend:8080/api/chat/send;
        include /etc/nginx/snippets/proxy.inc;
    }

    # 文件上传
    location ~ ^/api/(file|upload)/ {
        limit_req zone=rl_upload burst=10 nodelay;
        client_max_body_size 50m;
        proxy_pass http://backend:8080$request_uri;
        include /etc/nginx/snippets/proxy.inc;
        proxy_read_timeout 300s;
    }

    # ---------------- 后端接口（兜底） ----------------
    location /api/ {
        limit_req zone=rl_global burst=60 nodelay;
        proxy_pass http://backend:8080/api/;
        include /etc/nginx/snippets/proxy.inc;
    }

    # ---------------- 静态资源 ----------------
    # 构建产物带 content hash，可放心长缓存
    location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # location 内出现 add_header 后不再继承 server 级，安全头要重新带上
        include /etc/nginx/snippets/sec-headers.inc;
        access_log off;
        try_files $uri =404;
    }

    # ---------------- 前端入口 ----------------
    # 管理端是 history 路由：任何未命中的路径都要回落到 index.html，
    # 否则刷新 /service/policy 这类子路由会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML 不缓存，保证发版后用户拿到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/sec-headers.inc;
    }

    location = /mobile.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/sec-headers.inc;
    }

    # ---------------- 压缩 ----------------
    # 注意不要包含 text/event-stream，压缩会破坏流式分帧
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
